<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang quản trị</title>
  <style>
    body { font-family: Arial; margin:20px; background:#f9f9f9; }
    h1 { text-align:center; }
    table { border-collapse:collapse; width:100%; margin-top:20px; background:white; }
    th, td { border:1px solid #ccc; padding:8px; text-align:left; }
    input { margin:5px; padding:5px; }
    button { margin:5px; padding:5px 10px; cursor:pointer; }
    .section { margin-bottom:40px; }
  </style>
</head>
<body>
  <h1>Trang quản trị</h1>
<img src="images/logo.png" alt="Logo" width="80">
<h1>Trang quản trị</h1>

  <div class="section">
    <h2>👤 Quản lý Người dùng</h2>
    <input id="userName" placeholder="Họ tên">
    <input id="userEmail" placeholder="Email">
    <input id="userRole" placeholder="Vai trò (admin/user)">
    <input id="userPassword" placeholder="Mật khẩu">
    <button onclick="addUser()">Thêm</button>
    <table id="userTable">
      <thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Hành động</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h2>📦 Quản lý Sản phẩm</h2>
    <input id="prodName" placeholder="Tên sản phẩm">
    <input id="prodPrice" placeholder="Giá">
    <input id="prodDesc" placeholder="Mô tả">
    <input id="prodImg" placeholder="Link ảnh">
    <button onclick="addProduct()">Thêm</button>
    <table id="prodTable">
      <thead><tr><th>Tên</th><th>Giá</th><th>Mô tả</th><th>Ảnh</th><th>Hành động</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div style="text-align:center">
    <button onclick="logout()">Đăng xuất</button>
  </div>

  <script>
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));
    if(!currentUser || currentUser.role !== "admin"){
      window.location.href = "login.html";
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];
    let products = JSON.parse(localStorage.getItem("products")) || [];

    function renderUsers(){
      const tbody = document.querySelector("#userTable tbody");
      tbody.innerHTML = "";
      users.forEach((u,i)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${u.name}</td><td>${u.email}</td><td>${u.role}</td>
          <td><button onclick="deleteUser(${i})">Xóa</button></td>`;
        tbody.appendChild(tr);
      });
    }

    function renderProducts(){
      const tbody = document.querySelector("#prodTable tbody");
      tbody.innerHTML = "";
      products.forEach((p,i)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.name}</td><td>${p.price.toLocaleString()}</td><td>${p.desc}</td>
          <td><img src="${p.img}" width="60"></td>
          <td><button onclick="deleteProduct(${i})">Xóa</button></td>`;
        tbody.appendChild(tr);
      });
    }

    function addUser(){
      const name = document.getElementById("userName").value;
      const email = document.getElementById("userEmail").value;
      const role = document.getElementById("userRole").value;
      const password = document.getElementById("userPassword").value;
      if(name && email && role && password){
        users.push({name,email,role,password});
        localStorage.setItem("users", JSON.stringify(users));
        renderUsers();
      }
    }

    function deleteUser(index){
      users.splice(index,1);
      localStorage.setItem("users", JSON.stringify(users));
      renderUsers();
    }

    function addProduct(){
      const name = document.getElementById("prodName").value;
      const price = parseInt(document.getElementById("prodPrice").value);
      const desc = document.getElementById("prodDesc").value;
      const img = document.getElementById("prodImg").value;
      if(name && price && desc && img){
        products.push({name,price,desc,img});
        localStorage.setItem("products", JSON.stringify(products));
        renderProducts();
      }
    }

    function deleteProduct(index){
      products.splice(index,1);
      localStorage.setItem("products", JSON.stringify(products));
      renderProducts();
    }

    function logout(){
      localStorage.removeItem("currentUser");
      window.location.href = "login.html";
    }

    renderUsers();
    renderProducts();
  </script>
</body>
</html>
