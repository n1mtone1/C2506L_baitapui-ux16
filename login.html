<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <style>
    body { font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#f5f5f5;}
    form { background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2);}
    input { display:block; margin:10px 0; width:250px; padding:10px; }
    button { padding:10px 20px; cursor:pointer; }
    .error { color:red; margin-top:10px; }
  </style>
</head>
<body>
  <form id="loginForm">
    <h2>Đăng nhập</h2>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Mật khẩu" required>
    <button type="submit">Đăng nhập</button>
    <div id="error" class="error"></div>
  </form>

  <script>
    if(!localStorage.getItem("users")){
      const users = [
        {name:"Admin", email:"admin@example.com", role:"admin", password:"123456"},
        {name:"User", email:"user@example.com", role:"user", password:"123456"}
      ];
      localStorage.setItem("users", JSON.stringify(users));
    }

    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const users = JSON.parse(localStorage.getItem("users")) || [];
      const found = users.find(u => u.email === email && u.password === password);
      const errorDiv = document.getElementById("error");

      if(found){
        localStorage.setItem("currentUser", JSON.stringify(found));
        if(found.role === "admin"){
          window.location.href = "admin.html";
        } else {
          window.location.href = "home.html";
        }
      } else {
        errorDiv.textContent = "Email hoặc mật khẩu không đúng!";
      }
    });
  </script>
</body>
</html>
